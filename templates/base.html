<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DiabetesKNN{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">
      <span class="brand-dot">DK</span>
      <span>DiabetesKNN</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
             href="{{ url_for('main.index') }}">Beranda</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['main.form', 'main.predict'] %}active{% endif %}"
             href="{{ url_for('main.form') }}">Klasifikasi</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.metrics_page' %}active{% endif %}"
             href="{{ url_for('main.metrics_page') }}">Performa</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.tentang' %}active{% endif %}"
             href="{{ url_for('main.tentang') }}">Tentang</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
</div>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <div class="container text-center">
    <small>Dibuat dengan Flask, scikit-learn &middot; &copy; 2025 DiabetesKNN</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
